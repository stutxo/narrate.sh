<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src blob:; connect-src https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; media-src blob:; style-src 'unsafe-inline'; base-uri 'none'; object-src 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Narrate</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      color-scheme: light;
      color: #000;
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    body { margin: 0; }
    main {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: 1;
      letter-spacing: -0.08em;
    }
    .lede {
      margin: 12px 0 28px;
      color: #444;
    }
    form {
      padding: 18px;
      border: 1px solid #000;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    textarea,
    button,
    audio { width: 100%; }
    textarea,
    button {
      border: 1px solid #000;
      border-radius: 0;
      font: inherit;
    }
    textarea {
      display: block;
      min-height: 220px;
      padding: 12px;
      color: #000;
      background: #fff;
      resize: vertical;
    }
    textarea:focus,
    button:focus,
    audio:focus {
      outline: 2px solid #000;
      outline-offset: 2px;
    }
    button {
      min-height: 48px;
      margin-top: 14px;
      padding: 10px 16px;
      color: #fff;
      background: #000;
      cursor: pointer;
    }
    button:disabled {
      color: #555;
      background: #eee;
      border-style: dotted;
      cursor: default;
    }
    .status {
      min-height: 1.5em;
      margin: 12px 0 0;
      overflow-wrap: anywhere;
    }
    .output {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #000;
    }
    .note {
      margin: 16px 0 0;
      color: #444;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>narrate</h1>
    <p class="lede">Type English text. Hear it read aloud.</p>

    <form id="speech-form">
      <label for="text">Text</label>
      <textarea id="text" name="text" required autofocus placeholder="Type something to read aloud."></textarea>
      <button id="speak" type="submit">Read aloud</button>
      <p id="status" class="status" role="status" aria-live="polite">[idle] waiting for text.</p>
    </form>

    <div id="output" class="output" hidden>
      <audio id="audio" controls></audio>
    </div>

    <p class="note">The first run downloads and caches about 100 MB. Speech is generated in this browser with Kokoro and WASM; the text is not sent anywhere.</p>
  </main>

  <script type="module">
    const workerSource = `
      let KokoroTTS;
      let TextSplitterStream;
      const kokoroModule = import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js").then((module) => {
        KokoroTTS = module.KokoroTTS;
        TextSplitterStream = module.TextSplitterStream;
      });

      const MODEL_ID = "onnx-community/Kokoro-82M-v1.0-ONNX";
      const SAMPLE_RATE = 24000;
      const MAX_CHUNK_LENGTH = 420;
      let ttsPromise = null;

      function loadModel() {
        if (ttsPromise) return ttsPromise;

        self.postMessage({ type: "loading" });
        ttsPromise = kokoroModule
          .then(() => KokoroTTS.from_pretrained(MODEL_ID, {
            dtype: "q8",
            device: "wasm",
            progress_callback: (event) => {
              if (event.status === "progress" && Number.isFinite(event.progress)) {
                self.postMessage({
                  type: "model-progress",
                  file: event.file || "",
                  progress: event.progress,
                });
              }
            },
          }))
          .catch((error) => {
            ttsPromise = null;
            throw error;
          });
        return ttsPromise;
      }

      function splitLongSentence(sentence) {
        const chunks = [];
        let remaining = sentence.trim();

        while (remaining.length > MAX_CHUNK_LENGTH) {
          let splitAt = remaining.lastIndexOf(" ", MAX_CHUNK_LENGTH);
          if (splitAt < MAX_CHUNK_LENGTH / 2) {
            const nextSpace = remaining.indexOf(" ", MAX_CHUNK_LENGTH);
            splitAt = nextSpace > -1 && nextSpace <= MAX_CHUNK_LENGTH + 80
              ? nextSpace
              : MAX_CHUNK_LENGTH;
          }

          const chunk = remaining.slice(0, splitAt).trim();
          if (chunk) chunks.push(chunk);
          remaining = remaining.slice(splitAt).trim();
        }

        if (remaining) chunks.push(remaining);
        return chunks;
      }

      function splitText(text) {
        const splitter = new TextSplitterStream();
        splitter.push(text);
        const sentences = Array.from(splitter);
        return sentences.flatMap(splitLongSentence);
      }

      function writeAscii(view, offset, value) {
        for (let index = 0; index < value.length; index += 1) {
          view.setUint8(offset + index, value.charCodeAt(index));
        }
      }

      function encodeWav(chunks) {
        const pauseLength = Math.round(SAMPLE_RATE * 0.12);
        const sampleCount = chunks.reduce((total, chunk) => total + chunk.length, 0)
          + pauseLength * Math.max(0, chunks.length - 1);
        const buffer = new ArrayBuffer(44 + sampleCount * 2);
        const view = new DataView(buffer);

        writeAscii(view, 0, "RIFF");
        view.setUint32(4, 36 + sampleCount * 2, true);
        writeAscii(view, 8, "WAVE");
        writeAscii(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, SAMPLE_RATE, true);
        view.setUint32(28, SAMPLE_RATE * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeAscii(view, 36, "data");
        view.setUint32(40, sampleCount * 2, true);

        let offset = 44;
        for (let chunkIndex = 0; chunkIndex < chunks.length; chunkIndex += 1) {
          for (const value of chunks[chunkIndex]) {
            const sample = Math.max(-1, Math.min(1, value));
            view.setInt16(offset, Math.round(sample < 0 ? sample * 0x8000 : sample * 0x7fff), true);
            offset += 2;
          }
          if (chunkIndex < chunks.length - 1) offset += pauseLength * 2;
        }

        return new Blob([buffer], { type: "audio/wav" });
      }

      self.addEventListener("message", async (event) => {
        const text = typeof event.data.text === "string" ? event.data.text.trim() : "";
        if (!text) {
          self.postMessage({ type: "error", message: "Enter some text first." });
          return;
        }

        try {
          const tts = await loadModel();
          const textChunks = splitText(text);
          const audioChunks = [];

          for (let index = 0; index < textChunks.length; index += 1) {
            self.postMessage({
              type: "generating",
              current: index + 1,
              total: textChunks.length,
            });
            const audio = await tts.generate(textChunks[index], {
              voice: "af_heart",
            });
            audioChunks.push(audio.audio);
          }

          self.postMessage({ type: "complete", audio: encodeWav(audioChunks) });
        } catch (error) {
          self.postMessage({
            type: "error",
            message: error instanceof Error ? error.message : String(error),
          });
        }
      });
    `;

    const form = document.querySelector("#speech-form");
    const text = document.querySelector("#text");
    const button = document.querySelector("#speak");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");
    const audio = document.querySelector("#audio");
    const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: "text/javascript" }));

    let worker = null;
    let audioUrl = null;
    let busy = false;

    function setBusy(value, label = "Read aloud") {
      busy = value;
      button.disabled = value;
      button.textContent = label;
    }

    function fail(message) {
      setBusy(false);
      status.textContent = "[error] " + message;
    }

    function ensureWorker() {
      if (worker) return worker;

      const instance = new Worker(workerUrl, { type: "module" });
      instance.addEventListener("message", async (event) => {
        const message = event.data;

        if (message.type === "loading") {
          setBusy(true, "Loading voice...");
          status.textContent = "[loading] downloading the local voice model.";
          return;
        }

        if (message.type === "model-progress") {
          const isModel = message.file.includes("model_quantized.onnx");
          status.textContent = isModel
            ? "[loading] model " + Math.round(message.progress) + "%"
            : "[loading] preparing the voice model.";
          return;
        }

        if (message.type === "generating") {
          setBusy(true, "Generating...");
          status.textContent = message.total > 1
            ? "[working] reading section " + message.current + " of " + message.total + "."
            : "[working] generating speech locally.";
          return;
        }

        if (message.type === "error") {
          fail(message.message);
          return;
        }

        if (message.type === "complete") {
          if (audioUrl) URL.revokeObjectURL(audioUrl);
          audioUrl = URL.createObjectURL(message.audio);
          audio.src = audioUrl;
          output.hidden = false;
          setBusy(false);
          status.textContent = "[ready] audio generated.";

          try {
            await audio.play();
            status.textContent = "[playing] audio generated locally.";
          } catch {
            status.textContent = "[ready] audio generated. press play to hear it.";
          }
        }
      });

      instance.addEventListener("error", (event) => {
        fail(event.message || "The speech worker could not start.");
        instance.terminate();
        if (worker === instance) worker = null;
      });

      worker = instance;
      return worker;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (busy) return;

      const value = text.value.trim();
      if (!value) {
        status.textContent = "[idle] enter some text first.";
        text.focus();
        return;
      }

      setBusy(true, "Starting...");
      status.textContent = "[starting] opening the local speech engine.";
      ensureWorker().postMessage({ text: value });
    });

    audio.addEventListener("play", () => {
      status.textContent = "[playing] audio generated locally.";
    });

    audio.addEventListener("ended", () => {
      status.textContent = "[ready] playback finished.";
    });

    window.addEventListener("beforeunload", () => {
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      URL.revokeObjectURL(workerUrl);
      worker?.terminate();
    });
  </script>
</body>
</html>
