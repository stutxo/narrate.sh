<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; media-src blob:; style-src 'unsafe-inline' https://cdn.jsdelivr.net; base-uri 'none'; object-src 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>narrate.sh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.css" />
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root { color-scheme: light; color: #000; background: #fff; font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { margin: 0; }
    main { width: min(680px, 100%); margin: auto; padding: 48px 16px; }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 4rem); line-height: 1; letter-spacing: -0.08em; }
    .lede { margin: 12px 0 28px; color: #444; }
    form { padding: 18px; border: 1px solid; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    textarea, button { border: 1px solid #000; border-radius: 0; font: inherit; }
    textarea { display: block; width: 100%; min-height: 220px; padding: 12px; color: #000; background: #fff; resize: vertical; }
    button { min-height: 44px; padding: 8px 12px; color: #000; background: #fff; cursor: pointer; }
    button:disabled, textarea:disabled { color: #666; background: #f5f5f5; cursor: default; }
    :focus-visible { outline: 2px solid #000; outline-offset: 2px; }
    #speak { width: 100%; margin-top: 14px; color: #fff; background: #000; }
    #speak:disabled { color: #666; background: #eee; border-style: dotted; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: .8rem; }
    #status { min-height: 1.5em; margin: 12px 0 0; overflow-wrap: anywhere; }
    #output { margin-top: 18px; }
    audio { width: 100%; }
    #new-session { margin-top: 18px; }
    .plyr { --plyr-color-main: #000; --plyr-audio-controls-background: #fff; --plyr-audio-control-color: #000; --plyr-audio-control-color-hover: #fff; --plyr-range-fill-background: #000; }
    .plyr--audio .plyr__controls { border: 1px solid #000; border-radius: 0; }
  </style>
</head>
<body>
  <main>
    <h1>narrate.sh</h1>
    <p class="lede">Paste text, hear it read aloud by Kitten Micro, locally in your browser with WebGPU.</p>
    <form id="speech-form">
      <label for="text">Text</label>
      <textarea id="text" required disabled placeholder="Type something to read aloud."></textarea>
      <div class="meta"><span id="word-count">0 words</span><span>Kitten Micro · WebGPU</span></div>
      <button id="speak" type="submit" disabled>Read aloud</button>
      <p id="status" role="status" aria-live="polite">Opening your session…</p>
    </form>
    <div id="output" hidden>
      <audio id="audio" controls controlslist="nodownload" disableremoteplayback preload="metadata"></audio>
    </div>
    <button id="new-session" type="button" disabled>New session</button>
  </main>
  <script type="module" src="./app.js?v=6"></script>
</body>
</html>
